<body style="margin:0;padding:0;background:#F8FAFC;">

  <rect width="1280" height="720" fill="#F8FAFC"/>

  <!-- Step indicators in header -->

  <text x="1160" y="34" fill="#BFDBFE" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">⑤ 存储</text>

  <rect x="0" y="64" width="124" height="132" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>

  <text x="62" y="576" fill="#D97706" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">层</text>
  <text x="62" y="600" fill="#D97706" font-size="11" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">L1/L2/L3</text>

  <line x1="124" y1="196" x2="1280" y2="196" stroke="#E2E8F0" stroke-width="1.5"/>

  <line x1="124" y1="648" x2="1280" y2="648" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="454" y="286" fill="#EA580C" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">内存请求</text>

  <rect x="520" y="212" width="220" height="152" rx="8" fill="#EA580C"/>

  <text x="630" y="345" fill="#FEF3C7" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">page fault → SMAP</text>

  <line x1="630" y1="364" x2="630" y2="380" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrO)"/>

  <!-- LANE 3 CONTENT: SMAP -->
  <rect x="520" y="394" width="220" height="76" rx="8" fill="#1E3A8A"/>
  <text x="630" y="422" fill="white" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">SMAP 调度引擎</text>

  <text x="630" y="462" fill="#93C5FD" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">page reclaim / migrate</text>

  <line x1="520" y1="432" x2="448" y2="432" stroke="#1E3A8A" stroke-width="2"/>

  <line x1="630" y1="470" x2="630" y2="484" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="740" y1="432" x2="840" y2="432" stroke="#D97706" stroke-width="2"/>

  <text x="796" y="448" fill="#D97706" font-size="11" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">冷页→L3</text>

  <rect x="320" y="498" width="220" height="136" rx="8" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="430" y="524" fill="#1E3A8A" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">L1 · DRAM</text>
  <text x="430" y="546" fill="#1E3A8A" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">热数据</text>

  <text x="430" y="598" fill="#64748B" font-size="13" text-anchor="middle" font-family="Arial,sans-serif">~100ns</text>
  <text x="430" y="622" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">物理内存</text>

  <rect x="792" y="498" width="272" height="136" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="3"/>

  <text x="928" y="572" fill="#D97706" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">冷数据</text>
  <text x="928" y="598" fill="#D97706" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">4 TB</text>
  <text x="928" y="622" fill="#92400E" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">~100μs · 超分扩展</text>

  <!-- Footer -->
  <rect y="652" width="1280" height="68" fill="#F1F5F9"/>
