  <rect x="16" y="8" width="48" height="52" rx="6" fill="#2E3D4A" stroke="#4A6080" stroke-width="2"/>
  <!-- Drive bays -->
  <rect x="22" y="14" width="36" height="7" rx="2" fill="#1a2840" stroke="#3d5a78" stroke-width="1"/>
  <rect x="22" y="24" width="36" height="7" rx="2" fill="#1a2840" stroke="#3d5a78" stroke-width="1"/>
  <rect x="22" y="34" width="36" height="7" rx="2" fill="#1a2840" stroke="#3d5a78" stroke-width="1"/>
  <!-- Status LEDs -->
  <circle cx="53" cy="17.5" r="2" fill="#22c55e"/>
  <circle cx="53" cy="27.5" r="2" fill="#22c55e"/>
  <circle cx="53" cy="37.5" r="2" fill="#f59e0b"/>
