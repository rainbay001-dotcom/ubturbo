<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>SMAP 场景示意 · 横向分层带</title>
</head>
<body style="margin:0;padding:0;background:#F8FAFC;">
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1E3A8A"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#EA580C"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#1E3A8A"/>

  <!-- Title area -->
  <rect x="0" y="0" width="1280" height="80" fill="#1E3A8A"/>
  <text x="640" y="30" fill="white" font-size="22" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">SMAP 内存分层架构 · 字节火山 AI 平台</text>
  <text x="640" y="56" fill="#93C5FD" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">openclaw browser · L2 UB 借用内存 + L3 NVMe → 提升整机超分比</text>
  <!-- Divider -->
  <line x1="0" y1="78" x2="1280" y2="78" stroke="#3B5998" stroke-width="2"/>

  <!-- ── BAND 1: Application Layer (y=84..252) ── -->
  <rect x="0" y="84" width="1280" height="168" fill="#F8FAFC"/>
  <!-- Side label -->
  <rect x="0" y="84" width="56" height="168" fill="#EA580C"/>
  <text x="28" y="185" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" transform="rotate(-90,28,185)">应用层</text>

  <!-- Platform badge -->
  <rect x="72" y="100" width="220" height="52" rx="8" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="182" y="122" fill="#1E3A8A" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">字节火山 AI 服务平台</text>
  <text x="182" y="142" fill="#3B82F6" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">Bytedance Volcano AI</text>

  <!-- Arrow from platform to VM -->
  <line x1="292" y1="126" x2="320" y2="126" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arr)"/>

  <!-- VM + openclaw (center, prominent) -->
  <rect x="324" y="92" width="688" height="148" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="668" y="118" fill="#EA580C" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">VM · 2vCPU / 4GB RAM</text>
  <!-- Browser chrome -->
  <rect x="344" y="128" width="648" height="96" rx="8" fill="white" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="344" y="128" width="648" height="22" rx="8" fill="#E2E8F0"/>
  <rect x="344" y="138" width="648" height="12" fill="#E2E8F0"/>
  <circle cx="360" cy="139" r="5" fill="#EF4444"/>
  <circle cx="376" cy="139" r="5" fill="#F59E0B"/>
  <circle cx="392" cy="139" r="5" fill="#22C55E"/>
  <rect x="408" y="133" width="400" height="14" rx="7" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <text x="608" y="143" fill="#EA580C" font-size="10" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">openclaw://browser · running · Web 渲染 + JS 引擎</text>
  <!-- Big openclaw text inside browser -->
  <text x="668" y="178" fill="#EA580C" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">openclaw browser</text>
  <text x="668" y="202" fill="#92400E" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">处理 Web 渲染 · 触发内存访问 · 热/温/冷页分布 → SMAP 感知</text>
  <text x="668" y="218" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">page fault → SMAP dispatch</text>

  <!-- User indicator -->
  <rect x="1028" y="100" width="228" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1142" y="122" fill="#475569" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">用户请求</text>
  <text x="1142" y="142" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">User → HTTP → VM</text>

  <!-- Down arrow band 1→2 -->
  <line x1="668" y1="240" x2="668" y2="262" stroke="#EA580C" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="700" y="254" fill="#EA580C" font-size="11" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">page fault</text>

  <!-- ── BAND 2: SMAP Layer (y=252..376) ── -->
  <rect x="0" y="252" width="1280" height="124" fill="#EFF6FF"/>
  <!-- Side label -->
  <rect x="0" y="252" width="56" height="124" fill="#1E3A8A"/>
  <text x="28" y="320" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" transform="rotate(-90,28,320)">SMAP层</text>

  <!-- SMAP full-width box -->
  <rect x="72" y="266" width="1192" height="96" rx="10" fill="#1E3A8A"/>
  <text x="640" y="298" fill="white" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">SMAP 内存调度引擎</text>
  <text x="640" y="320" fill="#93C5FD" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">热度感知 · page reclaim · folio migrate · 自动三层迁移 · openEuler OLK-6.6 · UB Stack</text>

  <!-- Three output labels -->
  <text x="288" y="344" fill="#1E3A8A" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">热页 → L1</text>
  <text x="640" y="344" fill="#059669" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">温页 → L2</text>
  <text x="992" y="344" fill="#D97706" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">冷页 → L3</text>

  <!-- Down arrows band2→3 -->
  <line x1="288" y1="362" x2="288" y2="388" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="640" y1="362" x2="640" y2="388" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="992" y1="362" x2="992" y2="388" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrA)"/>

  <!-- ── BAND 3: Memory Storage Layer (y=376..648) ── -->
  <rect x="0" y="376" width="1280" height="272" fill="#F8FAFC"/>
  <!-- Side label -->
  <rect x="0" y="376" width="56" height="272" fill="#475569"/>
  <text x="28" y="520" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif" transform="rotate(-90,28,520)">内存存储层</text>

  <!-- L1 DRAM -->
  <rect x="72" y="392" width="364" height="224" rx="12" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="254" y="422" fill="#1E3A8A" font-size="17" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">L1 · DRAM · 热数据</text>
  <!-- Bandwidth bar -->
  <rect x="92" y="434" width="324" height="18" rx="9" fill="#BFDBFE"/>
  <rect x="92" y="434" width="324" height="18" rx="9" fill="#1E3A8A"/>

  <!-- Stats -->
  <text x="174" y="490" fill="#1E3A8A" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">32 GB</text>
  <text x="174" y="514" fill="#64748B" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">物理内存</text>
  <text x="334" y="490" fill="#1E3A8A" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">~100ns</text>
  <text x="334" y="514" fill="#64748B" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">访问延迟</text>
  <text x="254" y="552" fill="#1E3A8A" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">活跃页 · 常驻 · 不迁移</text>
  <text x="254" y="572" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">hot pages · resident · no migration</text>
  <text x="254" y="592" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">JS/DOM 活跃对象</text>

  <!-- L2 UB -->
  <rect x="456" y="392" width="364" height="224" rx="12" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
  <text x="638" y="422" fill="#059669" font-size="17" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">L2 · UB 借用内存 · 温数据</text>
  <!-- Bandwidth bar: 60% -->
  <rect x="476" y="434" width="324" height="18" rx="9" fill="#BBF7D0"/>
  <rect x="476" y="434" width="194" height="18" rx="9" fill="#059669"/>
  <text x="573" y="446" fill="white" font-size="10" text-anchor="middle" font-family="Arial,sans-serif">███████ ~60% 带宽</text>
  <!-- Stats -->
  <text x="564" y="490" fill="#059669" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">128 GB</text>
  <text x="564" y="514" fill="#64748B" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">UB 借用容量</text>
  <text x="720" y="490" fill="#059669" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">~1μs</text>
  <text x="720" y="514" fill="#64748B" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">访问延迟</text>
  <text x="638" y="552" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">低频页 · 扩展 DRAM · 温热</text>
  <text x="638" y="572" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">warm pages · DRAM extension</text>
  <text x="638" y="592" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">页面缓存 / 历史 DOM</text>

  <!-- L3 NVMe (highlighted with badge) -->
  <rect x="840" y="392" width="424" height="224" rx="12" fill="#FFF7ED" stroke="#D97706" stroke-width="3"/>
  <rect x="940" y="398" width="224" height="28" rx="14" fill="#D97706"/>
  <text x="1052" y="418" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">⬆ 超分关键</text>
  <text x="1052" y="450" fill="#D97706" font-size="17" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">L3 · NVMe SSD · 冷数据</text>
  <!-- Bandwidth bar: 15% -->
  <rect x="860" y="462" width="384" height="18" rx="9" fill="#FDE68A"/>
  <rect x="860" y="462" width="57" height="18" rx="9" fill="#D97706"/>
  <text x="886" y="474" fill="white" font-size="10" text-anchor="middle" font-family="Arial,sans-serif">15%</text>
  <!-- Stats -->
  <text x="952" y="516" fill="#D97706" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">4 TB</text>
  <text x="952" y="540" fill="#92400E" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">NVMe 容量</text>
  <text x="1152" y="516" fill="#D97706" font-size="26" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">~100μs</text>
  <text x="1152" y="540" fill="#92400E" font-size="14" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">访问延迟</text>
  <text x="1052" y="576" fill="#92400E" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">冷页迁移 → 释放 DRAM → 超分</text>
  <text x="1052" y="596" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">cold pages → NVMe → DRAM freed</text>
  <text x="1052" y="612" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">→ 更多 VM 实例可部署</text>

  <!-- Footer -->
  <rect y="664" width="1280" height="56" fill="#1E3A8A"/>
  <text x="36" y="688" fill="#93C5FD" font-size="13" font-family="'Microsoft YaHei',Arial,sans-serif">信息流向：用户请求 → VM/openclaw → SMAP → L1 热 / L2 温 / L3 冷（超分关键）</text>
  <text x="36" y="710" fill="#BFDBFE" font-size="12" font-family="'Microsoft YaHei',Arial,sans-serif">字节火山 AI 平台 · SMAP 内存超分 · Style 09 · 横向分层带</text>
  <text x="1244" y="710" fill="#3B5998" font-size="12" text-anchor="end" font-family="Arial,sans-serif">9/10</text>
