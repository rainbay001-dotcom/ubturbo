<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Browser window -->
  <rect x="4" y="4" width="72" height="72" rx="6" ry="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <!-- Title bar -->
  <rect x="4" y="4" width="72" height="20" rx="6" ry="6" fill="#EA580C"/>
  <rect x="4" y="14" width="72" height="10" fill="#EA580C"/>
  <!-- Window buttons -->
  <circle cx="16" cy="14" r="4" fill="#FCA5A5"/>
  <circle cx="28" cy="14" r="4" fill="#FDE68A"/>
  <circle cx="40" cy="14" r="4" fill="#86EFAC"/>
  <!-- URL bar -->
  <rect x="50" y="10" width="20" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  <!-- Claw marks - 3 diagonal scratches -->
  <line x1="20" y1="32" x2="34" y2="70" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="44" y2="70" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="54" y2="70" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <!-- Claw tips -->
  <circle cx="20" cy="32" r="3.5" fill="#C2410C"/>
  <circle cx="32" cy="28" r="3.5" fill="#C2410C"/>
  <circle cx="44" cy="28" r="3.5" fill="#C2410C"/>
</svg>
