<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMAP 场景示意图 — 蓝图风格</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050a18;
      color: #c8e0ff;
      font-family: 'Rajdhani', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,168,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,168,255,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0,212,255,0.6);
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      color: #4a90b8;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    /* Main SVG diagram */
    .diagram-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Legend */
    .legend {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #7aa8c8;
      letter-spacing: 1px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #2a4a6a;
      letter-spacing: 2px;
    }
  </style>
</head>
