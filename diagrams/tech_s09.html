<text x="1103" y="632" text-anchor="middle" fill="#555" font-size="10">无需任何改动，</text>
<text x="1103" y="648" text-anchor="middle" fill="#555" font-size="10">内核层全自动管理内存层级</text>

<!-- Flow annotations -->
<rect x="310" y="530" width="600" height="130" rx="6" fill="#f0f4f8" stroke="#1B3A5C" stroke-width="1"/>
<text x="610" y="552" text-anchor="middle" fill="#1B3A5C" font-size="12" font-weight="bold">内存冷热迁移路径说明</text>
<text x="330" y="572" fill="#333" font-size="11">• 热页：近期频繁访问 → 保留 L1 DRAM，最低延迟（~100 ns）</text>
<text x="330" y="592" fill="#333" font-size="11">• 温页：中频访问 → 迁至 L2 UB借用内存，RDMA 跨机（~1 μs）</text>
<text x="330" y="612" fill="#333" font-size="11">• 冷页：长期未访问 → 迁至 L3 NVMe SSD，大容量低成本（~100 μs）</text>
<text x="330" y="632" fill="#555" font-size="10">• 冷页重新访问时：自动从 L3→L2→L1 按需回迁，全程对 VM 应用透明</text>
<text x="330" y="650" fill="#555" font-size="10">• 超分目标：增加 L3 NVMe 容量作为内存后备，VM 密度 3 台→6 台，超分比↑1.8×</text>
