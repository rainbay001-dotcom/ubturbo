  <text x="72" y="416" fill="#475569" font-size="14" font-family="'Microsoft YaHei',Arial,sans-serif">SMAP（内存分层管理）在字节火山 AI 平台上利用 L2 UB 借用内存与 L3 NVMe</text>
  <text x="72" y="438" fill="#475569" font-size="14" font-family="'Microsoft YaHei',Arial,sans-serif">扩展虚拟机可用内存总量，提升整机 VM 超分比，降低单台实例成本。</text>
  <text x="72" y="462" fill="#475569" font-size="14" font-family="'Microsoft YaHei',Arial,sans-serif">openclaw browser 在 VM 内运行，触发内存访问，由 SMAP 自动将冷热页分配至对应层级。</text>
  <text x="72" y="486" fill="#94A3B8" font-size="13" font-family="'Microsoft YaHei',Arial,sans-serif">workload: openclaw browser · 2vCPU/4GB VM · openEuler OLK-6.6 · UB Stack</text>
