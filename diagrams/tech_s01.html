<!-- Left panel: business context -->
<rect x="24" y="74" width="370" height="622" rx="6" fill="#f5f8fc" stroke="#dce6f0" stroke-width="1"/>

<text x="44" y="138" fill="#1B3A5C" font-size="13" font-weight="bold">▌ 客户背景</text>
<text x="44" y="160" fill="#444" font-size="12">字节跳动火山 AI 服务平台，承载批量</text>
<text x="44" y="178" fill="#444" font-size="12">AI 推理及 RPA 类业务负载。</text>

<text x="44" y="206" fill="#1B3A5C" font-size="13" font-weight="bold">▌ 业务负载</text>
<text x="44" y="228" fill="#444" font-size="12">每台虚机规格：2 vCPU / 4 GB RAM</text>
<text x="44" y="246" fill="#444" font-size="12">每台虚机内运行 openclaw browser</text>
<text x="44" y="264" fill="#444" font-size="12">（headless 无头浏览器，执行网页渲染、</text>
<text x="44" y="282" fill="#444" font-size="12">内容采集、自动化测试等任务）</text>

<text x="44" y="310" fill="#1B3A5C" font-size="13" font-weight="bold">▌ 当前痛点</text>
<rect x="44" y="320" width="6" height="44" fill="#c0392b" rx="2"/>
<text x="58" y="336" fill="#555" font-size="12">物理宿主机 DRAM 容量有限，单机</text>
<text x="58" y="352" fill="#555" font-size="12">可承载虚机数量受内存瓶颈制约。</text>
<rect x="44" y="374" width="6" height="44" fill="#c0392b" rx="2"/>
<text x="58" y="390" fill="#555" font-size="12">超分比低（约 1.0×），整机 VM</text>
<text x="58" y="406" fill="#555" font-size="12">密度难以提升，运营成本高。</text>

<text x="44" y="438" fill="#1B3A5C" font-size="13" font-weight="bold">▌ 改进目标</text>
<rect x="44" y="448" width="6" height="30" fill="#1B3A5C" rx="2"/>
<text x="58" y="468" fill="#555" font-size="12">引入 SMAP 内存分层，利用 L2（UB</text>
<rect x="44" y="488" width="6" height="30" fill="#1B3A5C" rx="2"/>
<text x="58" y="508" fill="#555" font-size="12">借用内存）+ L3（NVMe SSD）扩展</text>
<rect x="44" y="528" width="6" height="30" fill="#1B3A5C" rx="2"/>
<text x="58" y="548" fill="#555" font-size="12">有效内存容量，超分比目标 ↑ 1.8×。</text>

<text x="44" y="580" fill="#1B3A5C" font-size="13" font-weight="bold">▌ 技术栈</text>
<text x="44" y="600" fill="#666" font-size="11">openEuler OLK-6.6 · UB Stack</text>
<text x="44" y="618" fill="#666" font-size="11">DAMOS_DEMOTION · PSI 感知调度</text>
