<body style="margin:0;padding:0;background:#F8FAFC;">

  <rect width="1280" height="720" fill="#F8FAFC"/>

  <text x="36" y="50" fill="#93C5FD" font-size="13" font-family="'Microsoft YaHei',Arial,sans-serif">openclaw browser · L1 DRAM + L2 UB借用内存 + L3 NVMe（超分关键）</text>
  <!-- KPIs right -->

  <rect x="1072" y="8" width="180" height="48" rx="8" fill="#FFF8ED" stroke="#D97706" stroke-width="2"/>

  <text x="1162" y="48" fill="#92400E" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">NVMe 扩展内存池</text>

  <rect x="24" y="80" width="320" height="580" rx="12" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="184" y="116" fill="#1E3A8A" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">字节火山 AI 服务平台</text>

  <rect x="68" y="294" width="148" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="68" y="306" width="228" height="6" rx="3" fill="#E2E8F0"/>

  <text x="184" y="474" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">User → VM → openclaw</text>

  <!-- SMAP box -->
  <rect x="40" y="496" width="288" height="72" rx="8" fill="#1E3A8A"/>
  <text x="184" y="522" fill="white" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">SMAP 调度引擎</text>

  <text x="184" y="558" fill="#93C5FD" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">page reclaim · folio migrate</text>

  <rect x="408" y="312" width="309" height="20" rx="10" fill="#059669"/>

  <text x="720" y="358" fill="#059669" font-size="26" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">~1μs</text>
  <text x="720" y="380" fill="#64748B" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">延迟</text>
  <text x="880" y="358" fill="#059669" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">低频访问</text>
  <text x="880" y="380" fill="#64748B" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">温热页扩展</text>

  <!-- L2→L3 arrow -->
  <line x1="666" y1="424" x2="666" y2="444" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="700" y="436" fill="#D97706" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">冷页迁移 ↓</text>

  <!-- L3 NVMe (largest, highlighted) -->

  <rect x="620" y="456" width="172" height="32" rx="16" fill="#D97706"/>

  <rect x="408" y="524" width="77" height="20" rx="10" fill="#D97706"/>

  <text x="520" y="578" fill="#D97706" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">4 TB</text>
  <text x="520" y="600" fill="#92400E" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">NVMe 容量</text>
  <text x="520" y="618" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">~100μs 延迟</text>

  <text x="800" y="590" fill="#92400E" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">冷页迁移至 NVMe，</text>
  <text x="800" y="610" fill="#92400E" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">释放 DRAM 超分。</text>
  <text x="800" y="630" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">cold pages → NVMe → DRAM freed</text>
