  <!-- Screen -->
  <rect x="13" y="13" width="54" height="34" rx="2" ry="2" fill="#1a2840"/>
  <!-- Terminal lines -->
  <rect x="17" y="18" width="20" height="2.5" rx="1" fill="#4A9EFF" opacity="0.8"/>
  <rect x="17" y="24" width="32" height="2.5" rx="1" fill="#4A9EFF" opacity="0.6"/>
  <rect x="17" y="30" width="26" height="2.5" rx="1" fill="#4A9EFF" opacity="0.4"/>
  <rect x="17" y="36" width="18" height="2.5" rx="1" fill="#4A9EFF" opacity="0.3"/>
  <!-- Cursor -->
  <rect x="40" y="36" width="6" height="2.5" rx="1" fill="#7FFF00" opacity="0.9"/>
  <!-- Stand -->
  <rect x="34" y="52" width="12" height="8" rx="0" fill="#2E3D4A"/>
  <rect x="24" y="58" width="32" height="4" rx="2" fill="#2E3D4A" stroke="#4A6080" stroke-width="1.5"/>
</svg>
