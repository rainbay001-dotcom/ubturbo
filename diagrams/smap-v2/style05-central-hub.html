<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>smap 架构 - 中心辐射</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #fafafa;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .slide { width: 100%; height: 100%; display: flex; flex-direction: column; }

  .hdr {
    height: 76px; background: #1e3a5f;
    display: flex; align-items: center; padding: 0 64px;
  }
  .hdr h1 { font-size: 30px; font-weight: 700; color: #fff; }
  .hdr-divider { width: 1px; height: 30px; background: #2d5a8e; margin: 0 24px; }
  .hdr-sub { font-size: 18px; color: #7dd3fc; }

  .body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 60px; gap: 60px; }

  /* Left flow: user→vm */
  .left-flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .node-box {
    padding: 18px 30px; border-radius: 10px; text-align: center; min-width: 200px;
  }
  .nb-label { font-size: 12px; letter-spacing: 1px; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
  .nb-name { font-size: 20px; font-weight: 700; }
  .nb-desc { font-size: 13px; margin-top: 3px; }
  .nb-user { background: #f1f5f9; border: 2px solid #cbd5e1; }
  .nb-user .nb-name { color: #0f172a; }
  .nb-vm { background: #eff6ff; border: 2px solid #93c5fd; }
  .nb-vm .nb-name { color: #1e40af; }

  .flow-arrow {
    width: 2px; height: 40px; background: #3b82f6; position: relative; margin: 2px 0;
  }
  .flow-arrow::after {
    content: ''; position: absolute; bottom: -8px; left: -5px;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 10px solid #3b82f6;
  }

  /* Center: openclaw hub */
  .hub-wrap { position: relative; width: 360px; height: 360px; }
  .hub-circle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 240px; height: 240px; border-radius: 50%;
    background: #1e3a5f; border: 4px solid #2563eb;
    box-shadow: 0 0 0 12px rgba(37,99,235,0.12), 0 0 40px rgba(37,99,235,0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10;
  }
  .hub-label { font-size: 13px; color: #60a5fa; letter-spacing: 1px; }
  .hub-name { font-size: 22px; font-weight: 800; color: #fff; text-align: center; line-height: 1.2; }
  .hub-sub { font-size: 13px; color: #93c5fd; margin-top: 6px; text-align: center; }

  /* SVG connector lines drawn in HTML */
  .hub-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; overflow: visible;
  }

  /* Right: memory tiers */
  .right-tiers { display: flex; flex-direction: column; gap: 16px; }
  .tier-box {
    padding: 18px 28px; border-radius: 10px; min-width: 280px;
    border-left: 5px solid;
  }
  .tier-box .t-name { font-size: 20px; font-weight: 700; }
  .tier-box .t-detail { font-size: 13px; margin-top: 4px; }
  .tier-box .t-tag {
    display: inline-block; font-size: 12px; padding: 2px 10px;
    border-radius: 10px; margin-top: 6px; font-weight: 600;
  }
  .tl1 { background: #f8fafc; border-color: #6b7280; }
  .tl1 .t-name { color: #374151; }
  .tl1 .t-tag { background: #e5e7eb; color: #4b5563; }
  .tl2 { background: #f0f9ff; border-color: #0ea5e9; }
  .tl2 .t-name { color: #0369a1; }
  .tl2 .t-tag { background: #e0f2fe; color: #0369a1; }
  .tl3 { background: #fff7ed; border-color: #f59e0b; box-shadow: 0 2px 10px rgba(245,158,11,0.15); }
  .tl3 .t-name { color: #92400e; }
  .tl3 .t-detail { color: #b45309; }
  .tl3 .t-tag { background: #fef3c7; color: #92400e; }

  .footer-bar {
    height: 60px; background: #1e3a5f;
    display: flex; align-items: center; padding: 0 64px; gap: 40px;
  }
  .fb-item { display: flex; align-items: center; gap: 10px; }
  .fb-dot { width: 8px; height: 8px; border-radius: 50%; }
  .fb-text { font-size: 14px; color: #bae6fd; }
  .fb-text strong { color: #fff; }
</style>
</head>
<body>
<div class="slide">
  <div class="hdr">
    <h1>smap 超分架构</h1>
    <div class="hdr-divider"></div>
    <div class="hdr-sub">以 openclaw 为核心的内存调度体系</div>
  </div>

  <div class="body">
    <!-- Left: user → vm chain -->
    <div class="left-flow">
      <div class="node-box nb-user">
        <div class="nb-label">触发端</div>
        <div class="nb-name">用户请求</div>
        <div class="nb-desc">火山平台调度</div>
      </div>
      <div class="flow-arrow"></div>
      <div class="node-box nb-vm">
        <div class="nb-label">虚拟机</div>
        <div class="nb-name">2U4G VM</div>
        <div class="nb-desc">内存访问产生</div>
      </div>
      <div class="flow-arrow"></div>
      <div style="text-align:center; font-size:14px; color:#3b82f6; font-weight:600;">→ 进入 openclaw</div>
    </div>

    <!-- Center: openclaw hub with SVG arcs -->
    <div class="hub-wrap">
      <svg class="hub-svg" viewBox="0 0 360 360">
        <!-- Lines from hub to right tiers (approximate positions) -->
        <line x1="300" y1="120" x2="360" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="300" y1="180" x2="360" y2="180" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="300" y1="240" x2="360" y2="280" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
        <!-- Labels on lines -->
        <text x="218" y="128" fill="#64748b" font-size="12" font-family="sans-serif">热页→L1</text>
        <text x="210" y="175" fill="#0369a1" font-size="12" font-family="sans-serif">温页→L2</text>
        <text x="208" y="240" fill="#b45309" font-size="12" font-family="sans-serif" font-weight="600">冷页→L3</text>
      </svg>

      <div class="hub-circle">
        <div class="hub-label">★ 核心组件</div>
        <div class="hub-name">openclaw<br>browser</div>
        <div class="hub-sub">冷热感知<br>换页决策</div>
      </div>
    </div>

    <!-- Right: memory tiers -->
    <div class="right-tiers">
      <div class="tier-box tl1">
        <div class="t-name">L1 — 本地 DRAM</div>
        <div class="t-detail">最低延迟 · 热页常驻</div>
        <div class="t-tag">热</div>
      </div>
      <div class="tier-box tl2">
        <div class="t-name">L2 — UB 借用内存</div>
        <div class="t-detail">RDMA 跨节点 · 温页目标</div>
        <div class="t-tag">温</div>
      </div>
      <div class="tier-box tl3">
        <div class="t-name">L3 — NVMe SSD</div>
        <div class="t-detail">冷页换出 · 大幅扩容上限</div>
        <div class="t-tag">冷 · 超分关键层</div>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="fb-item">
      <div class="fb-dot" style="background:#3b82f6;"></div>
      <div class="fb-text"><strong>openclaw</strong> 是冷热识别与路由决策中枢</div>
    </div>
    <div class="fb-item">
      <div class="fb-dot" style="background:#f59e0b;"></div>
      <div class="fb-text"><strong>L3 NVMe</strong> 提供超分缓冲，显著提升整机 VM 承载量</div>
    </div>
    <div class="fb-item">
      <div class="fb-dot" style="background:#e2e8f0;"></div>
      <div class="fb-text">平台：字节火山 AI · 规格：2U4G VM</div>
    </div>
  </div>
</div>
</body>
</html>
