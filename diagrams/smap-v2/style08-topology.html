  <text x="640" y="50" fill="#93C5FD" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">openclaw browser · 三层内存拓扑 · L3 NVMe 超分关键</text>

  <text x="860" y="368" fill="#64748B" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">访问延迟</text>

  <text x="814" y="428" fill="#059669" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">L2 · UB 借用内存</text>

  <text x="860" y="484" fill="#059669" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">~1μs</text>
  <text x="764" y="504" fill="#64748B" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">借用容量</text>
  <text x="860" y="504" fill="#64748B" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">访问延迟</text>

  <rect x="684" y="536" width="556" height="120" rx="12" fill="#FFF7ED" stroke="#D97706" stroke-width="3"/>
  <rect x="800" y="542" width="156" height="24" rx="12" fill="#D97706"/>

  <text x="764" y="614" fill="#D97706" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">4 TB</text>
  <text x="764" y="636" fill="#92400E" font-size="13" text-anchor="middle" font-family="'Microsoft YaHei',Arial,sans-serif">~100μs</text>

  <text x="974" y="634" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="Arial,sans-serif">cold pages migrate to NVMe → DRAM freed → more VMs</text>
